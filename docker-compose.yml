services:
  mongodb:
    image: mongo:7.0
    container_name: talkyy-mongodb
    restart: unless-stopped
    # Security: Database is NOT exposed on host network (Audit C3).
    # Accessible only to internal services on talkyy-network.
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME:-talkyy_admin}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD:-talkyy_secure_vault_password_2026}
      - MONGO_INITDB_DATABASE=ChattApp
    volumes:
      - mongo_data:/data/db
    networks:
      - talkyy-network
    healthcheck:
      test: [ "CMD", "mongosh", "-u", "${MONGO_INITDB_ROOT_USERNAME:-talkyy_admin}", "-p", "${MONGO_INITDB_ROOT_PASSWORD:-talkyy_secure_vault_password_2026}", "--authenticationDatabase", "admin", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: talkyy-backend
    restart: unless-stopped
    # Port 4000 is internal-only to talkyy-network; reverse-proxied through Nginx on port 80/443.
    expose:
      - "4000"
    environment:
      - PORT=4000
      - DATABASE_URI=${DATABASE_URI:-mongodb://${MONGO_INITDB_ROOT_USERNAME:-talkyy_admin}:${MONGO_INITDB_ROOT_PASSWORD:-talkyy_secure_vault_password_2026}@mongodb:27017/ChattApp?authSource=admin}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET_MUST_BE_SET_IN_ENV}
      - JWT_EXPIRATION=${JWT_EXPIRATION:-7d}
      - CLIENT_URL=${CLIENT_URL:-http://localhost}
      - NODE_ENV=production
    volumes:
      - media_uploads:/app/public/media
      - image_uploads:/app/public/Image
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - talkyy-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: talkyy-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - talkyy-network

networks:
  talkyy-network:
    driver: bridge

volumes:
  mongo_data:
    driver: local
  media_uploads:
    driver: local
  image_uploads:
    driver: local
